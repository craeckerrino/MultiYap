[package]
name = "multiyap-web"
description = "Dienste im Browser in Rust: Datenbank, Arbeitsfläche und weitere Speicher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
multiyap-core = { path = "../core" }
wasm-bindgen = "=0.2.130"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
url = "2"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Crypto", "EventSource", "Document", "Element", "Event", "EventTarget", "HtmlElement", "KeyboardEvent", "Window", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "Storage", "Location", "Navigator", "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "DomException", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "CssStyleDeclaration", "DomStringMap", "Clipboard"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
