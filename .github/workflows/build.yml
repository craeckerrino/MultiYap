# Baut den Windows-Installer und führt die Tests aus. Der fertige Installer liegt als Artefakt am Lauf.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Muss genau zur Version im Cargo.lock passen.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - run: npm ci

      # Zuerst bauen: Die Tests des Desktop-Programms brauchen den fertigen Ordner dist.
      - name: Installer bauen
        run: npm run app:dist

      - name: Tests
        run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: MultiYap-Setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
