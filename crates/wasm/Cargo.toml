[package]
name = "multiyap-wasm"
description = "Brücke zwischen der Rust-Fachlogik (crates/core) und der Oberfläche im Browser (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
multiyap-core = { path = "../core" }
multiyap-ui = { path = "../ui" }
multiyap-web = { path = "../web" }
wasm-bindgen = "=0.2.130"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "Request", "RequestCredentials", "RequestInit", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "DomException", "HtmlElement", "Response", "WebSocket"] }
url = "2"
